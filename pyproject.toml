[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maple-vision-platform"
version = "0.2.0"
description = "Offline visual research, reproducible datasets and deterministic simulation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["Pillow>=12,<14", "numpy>=2,<3"]

[project.scripts]
maple-vision = "maple_vision.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "mypy>=1.13,<2", "build>=1,<2", "PyYAML>=6,<7", "hypothesis>=6,<7", "onnx>=1.17,<2", "onnxruntime>=1.32,<2"]
inference = ["onnxruntime>=1.32,<2"]
video = ["opencv-python>=4.7,<6"]
training = ["ultralytics>=8.3,<9", "onnx>=1.17,<2", "onnxruntime>=1.32,<2"]

[tool.setuptools.package-data]
maple_vision = ["py.typed", "resources/*.yaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
files = ["src"]
