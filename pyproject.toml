[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maple-vision-platform"
version = "0.0.1"
description = "Offline visual research and deterministic simulation foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
maple-vision = "maple_vision.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "mypy>=1.13,<2", "build>=1,<2", "PyYAML>=6,<7"]

[tool.setuptools.package-data]
maple_vision = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
files = ["src"]
