name: Offline Platform CI
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  ORT_DISABLE_TELEMETRY: '1'
concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt
            requirements-workbench.txt
      - name: Stage stable Tcl/Tk runtime for native desktop tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $source = Join-Path $env:pythonLocation 'tcl'
          $target = Join-Path $env:RUNNER_TEMP 'maple-tcl'
          Copy-Item -LiteralPath $source -Destination $target -Recurse -Force
          $tclLibrary = Join-Path $target 'tcl8.6'
          $tkLibrary = Join-Path $target 'tk8.6'
          if (-not (Test-Path -LiteralPath (Join-Path $tclLibrary 'init.tcl'))) {
            throw 'staged Tcl runtime is missing init.tcl'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $tkLibrary 'tk.tcl'))) {
            throw 'staged Tk runtime is missing tk.tcl'
          }
          "TCL_LIBRARY=$tclLibrary" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TK_LIBRARY=$tkLibrary" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install pinned runtime and development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Install package without resolving a second dependency set
        run: python -m pip install --no-build-isolation --no-deps -e .
      - name: Check dependency consistency
        run: python -m pip check
      - name: Format
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Types
        run: python -m mypy
      - name: Native Windows desktop acceptance in isolated processes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tests = @(
            'test_native_external_window_capture_focus_and_resume',
            'test_native_external_window_pixels_feed_player_visible_observation',
            'test_windows_first_use_replay',
            'test_player_can_export_their_own_trial'
          )
          foreach ($test in $tests) {
            python -m pytest -q "tests/test_owned_window_windows.py::$test" `
              "--junitxml=artifacts/pytest-$test.xml"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
      - name: Tests including native ONNX adapter
        if: runner.os != 'Windows'
        run: python -m pytest -q --junitxml=artifacts/pytest.xml
      - name: Tests excluding separately accepted native Windows desktop cases
        if: runner.os == 'Windows'
        run: >-
          python -m pytest -q
          --ignore=tests/test_owned_window_windows.py
          --junitxml=artifacts/pytest.xml
      - name: Build wheel
        run: python -m build --wheel --no-isolation
      - name: Isolated installed-package smoke
        run: python scripts/wheel_smoke.py
      - name: Verify real Chromium workbench interactions
        if: runner.os == 'Linux'
        run: |
          python -m pip install playwright==1.62.0
          python scripts/verify_workbench_browser.py --output artifacts/workbench-browser.json
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-evidence-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  training-smoke:
    name: CPU YOLO training and ONNX export / ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAPLE_TRAINING_SMOKE: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt
            requirements-workbench.txt
            requirements-training.txt
      - name: Install pinned CPU wheels from the official PyTorch index
        run: >-
          python -m pip install --no-deps
          --index-url https://download.pytorch.org/whl/cpu
          torch==2.15.0+cpu torchvision==0.29.2+cpu
      - name: Install pinned training dependencies
        run: python -m pip install -r requirements-training.txt
      - name: Install local OCR engine for native adapter checks
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Install package without changing dependency versions
        run: python -m pip install --no-build-isolation --no-deps -e .
      - name: Check dependency consistency
        run: python -m pip check
      - name: Prepare native test artifacts
        run: python -c "from pathlib import Path; Path('artifacts').mkdir(exist_ok=True)"
      - name: Train, export, infer, decode local video, and run local OCR
        run: >-
          python -m pytest tests/test_training.py tests/test_terrain_audit.py tests/test_recordings.py tests/test_ocr.py -q
          --basetemp=artifacts/training-smoke
          --junitxml=artifacts/pytest-training.xml
      - name: Training smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-smoke-evidence-ubuntu
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
