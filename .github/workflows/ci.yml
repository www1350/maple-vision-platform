name: Foundation CI
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned tools
        run: python -m pip install -r requirements-dev.txt
      - name: Install package
        run: python -m pip install --no-build-isolation -e .
      - name: Format
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Types
        run: python -m mypy
      - name: Tests
        run: python -m pytest -q --junitxml=artifacts/pytest.xml
      - name: Build wheel
        run: python -m build --wheel --no-isolation
      - name: Isolated installed-package smoke
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          import venv

          checkout = Path.cwd()
          wheels = list((checkout / "dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          scratch = Path(tempfile.mkdtemp(prefix="maple-wheel-"))
          environment = scratch / "venv"
          venv.EnvBuilder(with_pip=True).create(environment)
          bindir = environment / ("Scripts" if os.name == "nt" else "bin")
          python = bindir / ("python.exe" if os.name == "nt" else "python")
          executable = bindir / ("maple-vision.exe" if os.name == "nt" else "maple-vision")
          clean_env = dict(os.environ)
          clean_env.pop("PYTHONPATH", None)
          clean_env.pop("PYTHONHOME", None)

          def execute(arguments):
              completed = subprocess.run(
                  arguments, cwd=scratch, env=clean_env,
                  check=True, capture_output=True, text=True,
              )
              print(completed.stdout)
              return completed.stdout

          execute([str(python), "-m", "pip", "install", "--no-index", "--no-deps", str(wheels[0])])
          execute([str(executable), "--help"])
          location = execute([
              str(python), "-c",
              "import maple_vision; from pathlib import Path; print(Path(maple_vision.__file__).resolve())",
          ]).strip()
          assert not Path(location).is_relative_to(checkout), location
          trace = scratch / "demo.jsonl"
          summary = json.loads(execute([
              str(python), "-m", "maple_vision", "demo", "--frames", "3", "--output", str(trace),
          ]))
          assert summary["frames_processed"] == 3, summary
          assert summary["intents_emitted"] == 3, summary
          assert summary["executions_skipped"] == 3, summary
          assert summary["verifications_not_applicable"] == 3, summary
          rows = [json.loads(line) for line in trace.read_text(encoding="utf-8").splitlines()]
          assert len(rows) == 3, rows
          assert all("schema_version" in row for row in rows), rows
          database = scratch / "knowledge.db"
          execute([str(python), "-m", "maple_vision", "db", "init", str(database)])
          execute([str(python), "-m", "maple_vision", "db", "check", str(database)])
          artifact_dir = checkout / "artifacts"
          artifact_dir.mkdir(exist_ok=True)
          (artifact_dir / "wheel-smoke.json").write_text(
              json.dumps({"module": location, "summary": summary}, indent=2), encoding="utf-8",
          )
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-evidence-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
