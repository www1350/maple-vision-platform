  operating_systems: [ubuntu-latest, windows-latest]
  required_evidence: [commit_sha, commands, actual_results, environment, ci_urls, limitations]
  pending_gates_must_remain_explicit: true
  plan_values_are_not_measured_success: true
  unsuccessful_models_must_not_be_promoted: true
