invariants:
  - Runtime vision and policy receive pixels and observations, never simulator dynamic truth.
  - Full baseline comparison, catalog mutation and expected-state check are one atomic transaction.
  - Knowledge-plan hashes and artifact hashes are integrity identifiers, not signatures or approvals.
  - Dataset coverage is replayed evidence, not a learned-agent success measurement.
  - Group AP is recomputed within groups and cannot be added; overlapping tags cannot be summed.
  - Action replay, actual perception/policy reinference and task completion are distinct conclusions.
  - Reproducing a recorded failure does not turn that episode into a successful mission.
  - Process resource measurements identify sources and units, and unsupported readings remain unknown.
  - Exact-commit engineering acceptance does not grant model promotion, real-domain or 24-hour acceptance.
  - All actions execute in the independent simulator; no official-client controller exists.

excluded:
  - official_client_automation
  - anti_cheat_bypass
  - account_safety_guarantees
  - automatic_message_sending
  - claims_that_synthetic_metrics_establish_real_game_performance

