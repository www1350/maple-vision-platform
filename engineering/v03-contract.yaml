invariants:
  - Preserve old v0.1 and v0.2 APIs, models and historical evidence.
  - Do not pass dynamic simulator truth to the runtime detector or policy.
  - Freeze protocol before candidate training and report the observed baseline honestly.
  - Keep complete source hashes, input hashes, original failures and unmodified preregistration.
  - Structural capacity and training completion do not establish learned accuracy.
  - New sessions with distinct pixels do not establish unseen-map or real-domain performance.
  - A platform aggregate can hide full-floor failures; match all platforms before stratification.
  - Conditional geometry errors must be accompanied by full-floor recall and nonempty counts.
  - Pipeline identity binds the terrain source as well as model bytes and thresholds.
  - Actual reinference must execute perception, supervisor and policy through the terminal frame.
  - Engineering acceptance and model promotion are separate results.
  - Failed validation does not authorize another candidate or peeking at holdout scores.
  - All actions execute in the independent simulator only.
